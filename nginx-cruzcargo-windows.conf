server {
    listen 443 ssl;
    server_name cruzcargo.pe www.cruzcargo.pe;

    # Ruta a los archivos de certificados SSL
    ssl_certificate C:/nginx-1.26.2/generador-ssl/cruzcargo.pe/cruzcargo.pe-chain.pem;
    ssl_certificate_key C:/nginx-1.26.2/generador-ssl/cruzcargo.pe/cruzcargo.pe-key.pem;

    # Configuración recomendada para SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:AES128-GCM-SHA256';
    ssl_prefer_server_ciphers off;

    # Redirigir tráfico HTTP a HTTPS
    error_page 497 https://$host$request_uri;

    # Aplicación principal (main)
    root C:/nginx-1.26.2/html/cruzcargo/main;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # ========================================
    # Aplicación React en /erpfacturacion
    # ========================================
    location /erpfacturacion {
        # IMPORTANTE: alias debe apuntar a la carpeta EXACTA donde está index.html
        alias C:/nginx-1.26.2/html/cruzcargo/erpfacturacion;
        index index.html;
        try_files $uri $uri/ /erpfacturacion/index.html;
    }

    # Sin caché para index.html de erpfacturacion
    location = /erpfacturacion/index.html {
        alias C:/nginx-1.26.2/html/cruzcargo/erpfacturacion/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Cache para assets estáticos de erpfacturacion
    location ~ ^/erpfacturacion/assets/ {
        alias C:/nginx-1.26.2/html/cruzcargo/erpfacturacion/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ========================================
    # Proxies para APIs
    # ========================================
    location /api/ {
        proxy_pass http://localhost:9191/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        sub_filter_once off;
    }

    location /facturacion/ {
        proxy_pass http://localhost:9183/facturacion/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        sub_filter_once off;
    }

    location /encomiendas/ {
        proxy_pass http://localhost:9184/encomiendas/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        sub_filter_once off;
    }

    location /wsefact/ {
        proxy_pass http://localhost:9185/wsefact/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /wsefact/prod/ {
        proxy_pass http://localhost:9186/wsefact/prod/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Redirección HTTP a HTTPS (opcional)
server {
    listen 80;
    server_name cruzcargo.pe www.cruzcargo.pe;
    return 301 https://$host$request_uri;
}
