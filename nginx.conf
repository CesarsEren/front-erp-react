# =============================================
# BLOQUE /erpfacturacion PARA PEGAR EN TU NGINX
# =============================================
# Pega SOLO este bloque location dentro de tu server {} de cruzcargo.pe
# Reemplaza el bloque location /erpfacturacion que tienes actualmente.
#
# REQUISITO: Los archivos del build deben estar en:
#   C:/nginx-1.26.2/html/cruzcargo/erpfacturacion/
#       ├── index.html
#       └── assets/
#           ├── index-xxx.js
#           ├── vendor-xxx.js
#           ├── ui-xxx.js
#           └── index-xxx.css

location /erpfacturacion {
    root C:/nginx-1.26.2/html/cruzcargo;
    index index.html;
    try_files $uri $uri/ /erpfacturacion/index.html;
}
