# Configuración de prueba para Nginx - CruzCargo en /erpfacturacion
# Copiar este archivo a: /etc/nginx/conf.d/cruzcargo.conf

server {
    listen 80;
    server_name localhost;  # Cambia por tu dominio en producción
    
    # Logs
    access_log /var/log/nginx/cruzcargo_access.log;
    error_log /var/log/nginx/cruzcargo_error.log debug;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Cache para assets estáticos
    location ~* ^/erpfacturacion/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Aplicación React en /erpfacturacion
    location /erpfacturacion {
        alias /usr/share/nginx/html/erpfacturacion;
        index index.html;
        try_files $uri $uri/ /erpfacturacion/index.html;
        
        # Sin caché para index.html
        location = /erpfacturacion/index.html {
            alias /usr/share/nginx/html/erpfacturacion/index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # Redirección de raíz a /erpfacturacion (opcional)
    location = / {
        return 301 /erpfacturacion/;
    }

    # Proxy para API (ajusta según tu configuración)
    location /api/ {
        proxy_pass https://cruzcargo.com/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
